# Pi coding agent (OpenCode Go) e2e stack. The shared collector comes from
# compose.e2e-base.yaml; only the Pi agent is defined here, so this stack never
# requires other stacks' credentials. The agent's telemetry endpoint and the
# @amaster.ai/pi-telemetry extension are baked into the image
# (e2e/pi/settings.json); only credentials and run parameters flow through env.
include:
  - compose.e2e-base.yaml

services:
  agent:
    build:
      context: e2e/pi
      args:
        - PI_CODING_AGENT_VERSION
    environment:
      # Pi reaches OpenCode Go through its built-in opencode-go provider, which
      # reads the key from OPENCODE_API_KEY and sends Go's session header;
      # scripts/e2e-pi.sh checks this credential before Compose runs.
      OPENCODE_API_KEY: "${OPENCODE_API_KEY:-}"
      E2E_AGENT_TIMEOUT: "${E2E_AGENT_TIMEOUT:-10m}"
      E2E_PI_MODEL: "${E2E_PI_MODEL:-opencode-go/claude-haiku-5-5}"
      E2E_RUN_ID: "${E2E_RUN_ID:?set E2E_RUN_ID or run scripts/e2e-pi.sh}"
    depends_on:
      collector:
        condition: service_healthy
