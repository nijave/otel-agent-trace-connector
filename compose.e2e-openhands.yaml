# OpenHands SDK e2e stack. The shared collector comes from
# compose.e2e-base.yaml; only the agent service is defined here, which keeps
# required credentials isolated per stack. The telemetry endpoint and
# protocol flow through env; nothing bakes into the image.
include:
  - compose.e2e-base.yaml

services:
  agent:
    build:
      context: e2e/openhands
      args:
        OPENHANDS_SDK_VERSION: "${OPENHANDS_SDK_VERSION:-1.43.1}"
    environment:
      # OpenHands reaches its LLM provider directly through litellm; the key
      # is the only credential this stack needs, and scripts/e2e-openhands.sh
      # checks it before Compose runs, so it is optional here; a required (:?)
      # guard would only fire later and less clearly.
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-anthropic/claude-sonnet-4-5}"
      # Optional provider endpoint override, passed to the SDK LLM as
      # base_url. Points litellm at a provider-compatible endpoint such as
      # z.ai's Anthropic-compatible https://api.z.ai/api/anthropic; empty
      # keeps the provider default for LLM_MODEL.
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://collector:4318/v1/traces"
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
      E2E_AGENT_TIMEOUT: "${E2E_AGENT_TIMEOUT:-10m}"
      E2E_RUN_ID: "${E2E_RUN_ID:?set E2E_RUN_ID or run scripts/e2e-openhands.sh}"
    depends_on:
      collector:
        condition: service_healthy
