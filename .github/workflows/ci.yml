name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check shell syntax
        run: |
          bash -n scripts/e2e.sh scripts/e2e-claude.sh scripts/e2e-openai.sh scripts/e2e-strands.sh scripts/generate.sh scripts/lib-e2e.sh
          sh -n e2e/codex/run.sh e2e/claude/run.sh e2e/openai-adhoc/run.sh e2e/strands/run.sh
      - name: Lint shell scripts
        run: shellcheck scripts/e2e.sh scripts/e2e-claude.sh scripts/e2e-openai.sh scripts/e2e-strands.sh scripts/generate.sh scripts/lib-e2e.sh e2e/codex/run.sh e2e/claude/run.sh e2e/openai-adhoc/run.sh e2e/strands/run.sh
      - name: Check generated files are up to date
        run: |
          ./scripts/generate.sh
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::mdatagen output is stale; run ./scripts/generate.sh and commit the result"
            git status --porcelain
            git diff
            exit 1
          fi
      - name: Vet
        run: |
          go vet ./...
          (cd connector/codingagentconnector && go vet ./...)
      - name: Test
        run: |
          go test ./...
          (cd connector/codingagentconnector && go test ./...)
          # Compile the e2e-tagged validator test and confirm it skips without a run.
          go test -tags=e2e ./e2e/validator/
      - name: Race test
        run: |
          go test -race ./...
          (cd connector/codingagentconnector && go test -race ./...)

  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build custom Collector
        run: go run go.opentelemetry.io/collector/cmd/builder@v0.156.0 --config builder-config.yaml
      - name: Validate Collector configurations
        env:
          AWS_REGION: us-east-1
          E2E_RUN_ID: ci-validation
          OTEL_QUEUE_DIRECTORY: /tmp/otelcol-queue
          OTEL_QUEUE_MAX_SIZE_BYTES: "10485760"
          OTEL_S3_BUCKET: validation-only
        run: |
          ./dist/otelcol-coding-agents validate --config collector-config.yaml
          ./dist/otelcol-coding-agents validate --config examples/otelcol-s3.yaml
      - name: Validate Compose configurations
        env:
          E2E_RUN_ID: ci-validation
          OPENAI_API_KEY: validation-only
        run: |
          docker compose -f compose.e2e-codex.yaml config --quiet
          # The real key reaches responses-proxy only; the Codex agent gets a
          # placeholder, because config.toml's env_key just needs a value the proxy
          # will ignore.
          docker compose -f compose.e2e-codex.yaml config --format json \
            | jq -e '.services["responses-proxy"].environment.OPENAI_API_KEY == "validation-only"
                     and .services.agent.environment.OPENAI_API_KEY != "validation-only"'
          # ANTHROPIC_API_KEY must stay absent so it cannot shadow ANTHROPIC_AUTH_TOKEN.
          docker compose -f compose.e2e-claude.yaml config --format json \
            | jq -e '.services.agent.environment.ANTHROPIC_BASE_URL == "https://api.z.ai/api/anthropic" and (.services.agent.environment | has("ANTHROPIC_API_KEY") | not)'
          # Each new stack receives exactly one credential: the z.ai key as
          # OPENAI_API_KEY. No Anthropic credential may leak in.
          docker compose -f compose.e2e-openai.yaml config --quiet
          docker compose -f compose.e2e-openai.yaml config --format json \
            | jq -e '.services.agent.environment.OPENAI_API_KEY == "validation-only"
                     and (.services.agent.environment | has("ANTHROPIC_AUTH_TOKEN") | not)'
          docker compose -f compose.e2e-strands.yaml config --quiet
          docker compose -f compose.e2e-strands.yaml config --format json \
            | jq -e '.services.agent.environment.OPENAI_API_KEY == "validation-only"
                     and (.services.agent.environment | has("ANTHROPIC_AUTH_TOKEN") | not)'
      - name: Build container images
        run: |
          docker build --tag otelcol-coding-agents:ci .
          docker build --tag codex-e2e:ci e2e/codex
          docker build --tag claude-e2e:ci e2e/claude
          # The Codex stack cannot run without this one, and it is the only image
          # built from a git ref rather than an immutable registry artifact, so a
          # vanished fork branch or a broken dependency must fail here rather than
          # during someone's paid e2e run.
          docker build --tag responses-proxy-e2e:ci e2e/responses-proxy
          docker build --tag openai-adhoc-e2e:ci e2e/openai-adhoc
          docker build --tag strands-e2e:ci e2e/strands
      - name: Verify GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check
