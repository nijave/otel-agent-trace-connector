version: 2

project_name: otel-agent-trace-connector
dist: release-dist

before:
  hooks:
    - go run go.opentelemetry.io/collector/cmd/builder@v0.156.0 --config builder-config.yaml

builds:
  - id: otelcol-coding-agents
    dir: dist
    main: .
    binary: otelcol-coding-agents
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - files:
      - README.md
      - LICENSE
      - collector-config.yaml
      - examples/otelcol-s3.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: false
  prerelease: auto
