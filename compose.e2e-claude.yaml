# Claude Code (Bedrock) e2e stack. The shared collector comes from
# compose.e2e-base.yaml; only the Claude agent is defined here, so this stack never
# requires the Codex OPENAI_API_KEY.
#
# Credentials: a single ephemeral Bedrock API key (AWS_BEARER_TOKEN_BEDROCK) is
# the only credential passed into the container. All host AWS credential
# resolution stays outside the container -- see scripts/e2e-claude-bedrock.sh.
# https://docs.aws.amazon.com/bedrock/latest/userguide/api-keys.html
include:
  - compose.e2e-base.yaml

services:
  agent:
    build:
      context: e2e/claude
      args:
        CLAUDE_CODE_VERSION: "${CLAUDE_CODE_VERSION:-2.1.207}"
    environment:
      CLAUDE_CODE_USE_BEDROCK: "1"
      AWS_REGION: "${AWS_REGION:?AWS_REGION is required for the live Claude Bedrock E2E test}"
      AWS_BEARER_TOKEN_BEDROCK: "${AWS_BEARER_TOKEN_BEDROCK:?AWS_BEARER_TOKEN_BEDROCK is required; generate one with scripts/e2e-claude-bedrock.sh}"
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
      E2E_AGENT_TIMEOUT: "${E2E_AGENT_TIMEOUT:-10m}"
      E2E_CLAUDE_MAX_BUDGET_USD: "${E2E_CLAUDE_MAX_BUDGET_USD:-0.25}"
      E2E_CLAUDE_MAX_TURNS: "${E2E_CLAUDE_MAX_TURNS:-3}"
      E2E_CLAUDE_MODEL: &claude_model "${E2E_CLAUDE_MODEL:-us.anthropic.claude-haiku-4-5-20251001-v1:0}"
      ANTHROPIC_MODEL: *claude_model
      ANTHROPIC_DEFAULT_HAIKU_MODEL: *claude_model
      E2E_RUN_ID: "${E2E_RUN_ID:?set E2E_RUN_ID or run scripts/e2e-claude.sh}"
      OTEL_LOGS_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORT_INTERVAL: "500"
      # OTEL_LOG_* content gates are intentionally absent and therefore disabled.
    depends_on:
      collector:
        condition: service_healthy
