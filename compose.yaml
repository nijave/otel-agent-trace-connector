# Codex e2e stack. The shared collector and validator come from compose.base.yaml;
# only the Codex agent is defined here, so this stack never requires Claude/AWS
# credentials. The validator defaults E2E_AGENT to codex, so no override is needed.
include:
  - compose.base.yaml

services:
  agent:
    build:
      context: e2e/codex
      args:
        CODEX_VERSION: "${CODEX_VERSION:-0.144.1}"
    environment:
      CODEX_HOME: /codex-home
      E2E_AGENT_TIMEOUT: "${E2E_AGENT_TIMEOUT:-10m}"
      E2E_CODEX_MODEL: "${E2E_CODEX_MODEL:-gpt-5.1-codex-mini}"
      E2E_RUN_ID: "${E2E_RUN_ID:?set E2E_RUN_ID or run scripts/e2e.sh}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required for the live E2E test}"
    depends_on:
      collector:
        condition: service_healthy
