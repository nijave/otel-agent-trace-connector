services:
  collector:
    build:
      context: .
      args:
        OCB_VERSION: "0.156.0"
    volumes:
      - ./.e2e-output:/output
    environment:
      E2E_RUN_ID: "${E2E_RUN_ID:?set E2E_RUN_ID or run scripts/e2e.sh}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:13133/"]
      interval: 1s
      timeout: 2s
      retries: 30

  codex:
    build:
      context: e2e/codex
      args:
        CODEX_VERSION: "${CODEX_VERSION:-0.144.1}"
    environment:
      CODEX_HOME: /codex-home
      E2E_AGENT_TIMEOUT: "${E2E_AGENT_TIMEOUT:-10m}"
      E2E_CODEX_MODEL: "${E2E_CODEX_MODEL:-gpt-5.1-codex-mini}"
      E2E_RUN_ID: "${E2E_RUN_ID:?set E2E_RUN_ID or run scripts/e2e.sh}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required for the live E2E test}"
    depends_on:
      collector:
        condition: service_healthy

  validator:
    build:
      context: .
      dockerfile: e2e/validator/Dockerfile
    environment:
      E2E_RUN_ID: "${E2E_RUN_ID:?set E2E_RUN_ID or run scripts/e2e.sh}"
      TRACE_FILE: /output/canonical-traces.json
    volumes:
      - ./.e2e-output:/output:ro
    depends_on:
      collector:
        condition: service_healthy
      codex:
        condition: service_completed_successfully
