apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-agent-collector
  namespace: coding-agent-telemetry
spec:
  replicas: 3
  selector:
    matchLabels:
      app: coding-agent-collector
  template:
    metadata:
      labels:
        app: coding-agent-collector
    spec:
      containers:
        - name: collector
          # Published by the repo's release workflow on each v* tag. A fork
          # can instead build the root Dockerfile and point this at its own
          # registry.
          image: ghcr.io/nijave/otel-agent-trace-connector:v0.4.2
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: CANONICAL_OTLP_ENDPOINT
              value: "REPLACE_WITH_YOUR_BACKEND:4317"
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: coding-agent-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: coding-agent-collector
  namespace: coding-agent-telemetry
spec:
  clusterIP: None
  selector:
    app: coding-agent-collector
  ports:
    - name: otlp-grpc
      port: 4317
