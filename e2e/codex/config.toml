approval_policy = "never"
# The container is the isolation boundary; Codex's inner bubblewrap sandbox cannot
# nest a user namespace here, so it is disabled (run.sh passes the matching flag).
sandbox_mode = "danger-full-access"

# OpenCode Go serves the Responses API at https://opencode.ai/zen/go/v1, so Codex
# talks to it directly with wire_api = "responses". Go requires every request to
# carry a session id and recognizes the session header Codex sends natively.
# env_key names the variable that holds the real OpenCode Go key, which the
# container receives (see e2e/README.md). The model comes from --model
# (E2E_CODEX_MODEL).
model_provider = "opencode-go"

# Stamp model_reasoning_effort on telemetry events so captures carry the field
# the connector maps to gen_ai.request.reasoning.level.
model_reasoning_effort = "low"

[model_providers.opencode-go]
name = "OpenCode Go (Responses API)"
base_url = "https://opencode.ai/zen/go/v1"
env_key = "OPENCODE_API_KEY"
wire_api = "responses"

[otel]
environment = "e2e"
log_user_prompt = false
exporter = { otlp-http = { endpoint = "http://collector:4318/v1/logs", protocol = "binary" } }
