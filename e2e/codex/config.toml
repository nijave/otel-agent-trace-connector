approval_policy = "never"
# The container is the isolation boundary; Codex's inner bubblewrap sandbox cannot
# nest a user namespace here, so it is disabled (run.sh passes the matching flag).
sandbox_mode = "danger-full-access"

# Codex 0.144.1 requires wire_api="responses" (the Responses API); z.ai's coding
# endpoint only speaks chat-completions. The responses-proxy service (see
# e2e/responses-proxy/ and compose.e2e-codex.yaml) translates between the two, so
# Codex talks to the proxy rather than to z.ai directly. env_key must name a
# variable that is set, but the value only becomes a bearer token the proxy ignores
# (its auth.keys is empty), so the container holds a placeholder rather than the real
# z.ai key. The model comes from --model (E2E_CODEX_MODEL) and must be listed in the
# proxy config.
model_provider = "zai-proxy"

# Stamp model_reasoning_effort on telemetry events so captures carry the field
# the connector maps to gen_ai.request.reasoning.level. The proxy forwards or
# drops the request-side reasoning parameter; the log attribute comes from this
# config either way.
model_reasoning_effort = "low"

[model_providers.zai-proxy]
name = "z.ai via responses-proxy"
base_url = "http://responses-proxy:3000/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"

[otel]
environment = "e2e"
log_user_prompt = false
exporter = { otlp-http = { endpoint = "http://collector:4318/v1/logs", protocol = "binary" } }
