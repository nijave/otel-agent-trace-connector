# Shared collector for both e2e stacks. Included by compose.e2e-codex.yaml (Codex)
# and compose.e2e-claude.yaml (Claude); each of those defines only its own `agent`
# service, which keeps the required-credential env isolated per stack. The
# exported traces are validated on the host by `go test -tags=e2e ./e2e/validator`
# (see scripts/lib-e2e.sh), not by a container.
services:
  collector:
    build:
      context: .
      args:
        OCB_VERSION: "0.156.0"
    volumes:
      - ./.e2e-output:/output
    environment:
      E2E_RUN_ID: "${E2E_RUN_ID:?set E2E_RUN_ID or run the matching scripts/e2e*.sh}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:13133/"]
      interval: 1s
      timeout: 2s
      retries: 30
