# Codex e2e stack. The shared collector comes from compose.e2e-base.yaml. Codex
# talks to OpenCode Go directly (the Responses API endpoint); Go recognizes the
# session header Codex sends natively. This stack never requires Claude/AWS
# credentials. Exported traces are validated on the host by go test (see
# scripts/lib-e2e.sh).
include:
  - compose.e2e-base.yaml

services:
  agent:
    build:
      context: e2e/codex
      args:
        # The pin lives in the Dockerfile ARG default; set CODEX_VERSION in the environment to override.
        - CODEX_VERSION
    environment:
      CODEX_HOME: /codex-home
      E2E_AGENT_TIMEOUT: "${E2E_AGENT_TIMEOUT:-10m}"
      # OpenCode Go model (Responses API), reached directly (see e2e/codex/config.toml).
      E2E_CODEX_MODEL: "${E2E_CODEX_MODEL:-gpt-5.6-luna}"
      E2E_RUN_ID: "${E2E_RUN_ID:?set E2E_RUN_ID or run scripts/e2e.sh}"
      # The container holds the real OpenCode Go key: config.toml names this variable
      # as env_key, and Codex sends it as the bearer token to OpenCode Go. The agent
      # container is the isolation boundary, so model-issued commands run with full
      # access inside it (see e2e/README.md).
      OPENCODE_API_KEY: "${OPENCODE_API_KEY:-}"
    depends_on:
      collector:
        condition: service_healthy
