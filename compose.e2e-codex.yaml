# Codex e2e stack. The shared collector comes from compose.e2e-base.yaml; only the
# Codex agent is defined here, so this stack never requires Claude/AWS credentials.
# Exported traces are validated on the host by go test (see scripts/lib-e2e.sh).
include:
  - compose.e2e-base.yaml

services:
  agent:
    build:
      context: e2e/codex
      args:
        CODEX_VERSION: "${CODEX_VERSION:-0.144.1}"
    environment:
      CODEX_HOME: /codex-home
      E2E_AGENT_TIMEOUT: "${E2E_AGENT_TIMEOUT:-10m}"
      # z.ai GLM model served over its OpenAI-compatible endpoint (see
      # e2e/codex/config.toml).
      E2E_CODEX_MODEL: "${E2E_CODEX_MODEL:-glm-4.7}"
      E2E_RUN_ID: "${E2E_RUN_ID:?set E2E_RUN_ID or run scripts/e2e.sh}"
      # Holds the z.ai API key (config.toml reads it as env_key). scripts/e2e.sh
      # checks it before Compose runs, so it is optional here; a required (:?) guard
      # would only fire later and less clearly.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      collector:
        condition: service_healthy
